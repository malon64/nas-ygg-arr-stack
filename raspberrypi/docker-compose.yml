
networks:
  media-net:
    driver: bridge

x-common-env: &common-env
  PUID: "${PUID}"
  PGID: "${PGID}"
  TZ: "${TZ}"

x-logging: &common-logging
  driver: "json-file"
  options:
    max-size: "${DOCKERLOGGING_MAXSIZE}"
    max-file: "${DOCKERLOGGING_MAXFILE}"

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *common-env
    volumes:
      - ${DOCKERCONFDIR}/prowlarr:/config
    ports:
      - "${PROWLARR_PORT}:${PROWLARR_PORT}"
    networks:
      - media-net
    restart: unless-stopped
    logging: *common-logging

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *common-env
    volumes:
      - ${DOCKERCONFDIR}/radarr:/config
      - ${ARR_DATA_DIR}:/arr-data
    ports:
      - "${RADARR_PORT}:${RADARR_PORT}"
    networks:
      - media-net
    restart: unless-stopped
    logging: *common-logging

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *common-env
    volumes:
      - ${DOCKERCONFDIR}/sonarr:/config
      - ${ARR_DATA_DIR}:/arr-data
    ports:
      - "${SONARR_PORT}:${SONARR_PORT}"
    networks:
      - media-net
    restart: unless-stopped
    logging: *common-logging

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      <<: *common-env
      VERSION: docker
    volumes:
      - ${DOCKERCONFDIR}/plex:/config
      - ${MEDIA_MOVIES_HOST_DIR}:/data/movies
      - ${MEDIA_SHOWS_HOST_DIR}:/data/shows
    restart: unless-stopped
    logging: *common-logging

  watchlistarr:
    image: nylonee/watchlistarr:latest # using watchlistarr:pr229 for now
    container_name: watchlistarr
    environment:
      SONARR_API_KEY: "${SONARR_API_KEY}"
      RADARR_API_KEY: "${RADARR_API_KEY}"
      PLEX_TOKEN: "${WATCHLISTARR_PLEX_TOKEN}"
      LOG_LEVEL: "${WATCHLISTARR_LOG_LEVEL}"
    volumes:
      - ${DOCKERCONFDIR}/watchlistarr:/app/config
    depends_on:
      - sonarr
      - radarr
    networks:
      - media-net
    restart: unless-stopped
    logging: *common-logging
